[package]
name = "reserve"
version = "0.1.0"
edition = "2024"
description = "Learning Rust by building an inventory reservation service, one step at a time"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4"] }
